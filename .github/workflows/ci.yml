name: CI Pipeline

on:
  push:
    branches: [ task-1, task-2, task-3, main ]
  pull_request:
    branches: [ task-1, task-2, task-3, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg2 sqlalchemy

      - name: Run basic Python check
        run: |
          python -c "import pandas; import psycopg2; print('CI OK')"